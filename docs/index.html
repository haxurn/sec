<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cybersecurity Learning</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Cybersecurity learning documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg-a: #f8fbff;
      --bg-b: #eef4fb;
      --bg-c: #eaf1fa;
      --ink: #0f1d2f;
      --ink-soft: #50617a;
      --line: #d9e4f2;
      --line-strong: #bfd1e8;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-2: rgba(255, 255, 255, 0.84);
      --brand: #1f7a8c;
      --brand-2: #6b8dd6;
      --code-bg: linear-gradient(180deg, #132338, #101f33);
      --code-line: #233f62;
      --code-text: #c8dcf5;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-sm: 0 4px 16px rgba(31, 52, 85, 0.08);
      --shadow-md: 0 16px 40px rgba(31, 52, 85, 0.12);
    }

    body[data-theme="dark"] {
      --bg-a: #0d1420;
      --bg-b: #111c2b;
      --bg-c: #0b1420;
      --ink: #e5f0ff;
      --ink-soft: #9bb0cb;
      --line: #24364b;
      --line-strong: #3a5777;
      --panel: rgba(13, 22, 35, 0.9);
      --panel-2: rgba(15, 26, 41, 0.88);
      --brand: #6bd0de;
      --brand-2: #8bb4ff;
      --code-bg: linear-gradient(180deg, #0f1927, #0b1320);
      --code-line: #2c4463;
      --code-text: #d7e8ff;
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 20px 48px rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink) !important;
      font-family: 'Space Grotesk', sans-serif !important;
      font-size: 16px;
      line-height: 1.65;
      background:
        radial-gradient(1200px 700px at 8% -12%, rgba(107, 141, 214, 0.22), transparent 45%),
        radial-gradient(1000px 620px at 92% 2%, rgba(31, 122, 140, 0.2), transparent 52%),
        linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 60%, var(--bg-c) 100%) !important;
      min-height: 100vh;
      transition: background 0.28s ease, color 0.2s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 8px 12px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle:hover {
      border-color: var(--line-strong);
    }

    .sidebar {
      background: var(--panel) !important;
      border-right: 1px solid var(--line) !important;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-sm);
    }

    .sidebar > h1 {
      margin: 0 !important;
      padding: 24px 20px 14px !important;
      border-bottom: 1px solid var(--line);
      font-size: 18px !important;
      font-weight: 700 !important;
      line-height: 1.25 !important;
      color: var(--ink) !important;
      font-family: 'Space Grotesk', sans-serif !important;
    }

    .sidebar > h1 a {
      color: inherit !important;
      text-decoration: none !important;
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .sidebar-nav {
      padding: 12px 0 16px !important;
      font-family: 'IBM Plex Mono', monospace;
    }

    .sidebar-nav ul,
    .sidebar-nav li {
      margin: 0 !important;
      padding: 0 !important;
      list-style: none !important;
    }

    .sidebar-nav > ul > li > strong {
      display: block;
      padding: 8px 18px;
      font-size: 11px !important;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft) !important;
      opacity: 0.85;
    }

    .sidebar-nav a {
      display: block;
      margin: 0 10px;
      padding: 10px 12px !important;
      border-radius: 9px;
      color: var(--ink-soft) !important;
      text-decoration: none !important;
      border: 1px solid transparent;
      font-size: 12px !important;
      transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease;
    }

    .sidebar-nav a:hover {
      color: var(--ink) !important;
      background: rgba(107, 141, 214, 0.14) !important;
      border-color: var(--line);
      transform: translateX(2px);
    }

    .sidebar-nav li.active > a {
      color: var(--ink) !important;
      background: linear-gradient(120deg, rgba(107, 141, 214, 0.22), rgba(31, 122, 140, 0.18)) !important;
      border-color: var(--line-strong);
      font-weight: 600 !important;
    }

    .search {
      padding: 14px 16px 12px !important;
      border-bottom: 1px solid var(--line) !important;
      margin-bottom: 4px !important;
    }

    .search input {
      width: 100% !important;
      border: 1px solid var(--line) !important;
      border-radius: 10px !important;
      background: var(--panel-2) !important;
      color: var(--ink) !important;
      padding: 10px 12px !important;
      font-family: 'IBM Plex Mono', monospace !important;
      font-size: 12px !important;
    }

    .search input:focus {
      border-color: var(--brand-2) !important;
      box-shadow: 0 0 0 3px rgba(107, 141, 214, 0.16) !important;
      outline: none !important;
    }

    .content {
      padding-top: 10px !important;
      background: transparent !important;
    }

    .markdown-section {
      max-width: 1000px !important;
      margin: 0 auto 36px !important;
      padding: clamp(24px, 5vw, 44px) clamp(18px, 4vw, 42px) !important;
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      color: var(--ink) !important;
    }

    body.route-mobile-pentest .markdown-section {
      max-width: 1140px !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding-top: 20px !important;
      padding-bottom: 20px !important;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      margin-top: 1.8em !important;
      margin-bottom: 0.8em !important;
      color: var(--ink) !important;
      font-family: 'Space Grotesk', sans-serif !important;
      line-height: 1.2;
    }

    .markdown-section h1 {
      margin-top: 0 !important;
      font-size: clamp(2rem, 5vw, 3rem) !important;
      position: relative;
      padding-bottom: 14px;
    }

    .markdown-section h1::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 92px;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
    }

    .markdown-section h2 {
      font-size: clamp(1.4rem, 3.4vw, 2rem) !important;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .markdown-section h3 { font-size: 1.3rem !important; }

    .markdown-section p,
    .markdown-section li { color: var(--ink-soft) !important; }

    .markdown-section a {
      color: var(--brand) !important;
      text-decoration: none !important;
      border-bottom: 1px solid transparent;
    }

    .markdown-section a:hover { border-bottom-color: currentColor; }

    .markdown-section code {
      padding: 2px 7px !important;
      border-radius: 8px !important;
      border: 1px solid var(--line) !important;
      background: rgba(107, 141, 214, 0.1) !important;
      color: var(--brand) !important;
      font-family: 'IBM Plex Mono', monospace !important;
      font-size: 0.9em !important;
    }

    .markdown-section pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--code-line) !important;
      border-radius: var(--radius-md) !important;
      padding: 14px !important;
      margin: 1.4em 0 !important;
      overflow-x: auto;
    }

    .markdown-section pre code {
      background: transparent !important;
      border: 0 !important;
      color: var(--code-text) !important;
      padding: 0 !important;
    }

    .docsify-copy-code-button {
      border: 1px solid rgba(218, 233, 250, 0.55) !important;
      background: rgba(255, 255, 255, 0.1) !important;
      color: #d6e6fb !important;
      border-radius: 999px !important;
      font-family: 'IBM Plex Mono', monospace !important;
      font-size: 11px !important;
      padding: 4px 10px !important;
      margin: 8px !important;
    }

    .pagination-item-label {
      color: var(--ink-soft) !important;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px !important;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pagination-item-title {
      color: var(--ink) !important;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px !important;
    }

    @media (max-width: 900px) {
      .markdown-section {
        margin: 0 12px 22px !important;
        padding: 24px 18px !important;
      }

      .theme-toggle {
        top: auto;
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle color theme">
    <i data-lucide="moon-star"></i>
    <span id="themeLabel">Dark</span>
  </button>

  <div id="app">Loading documentation...</div>

  <script>
    (function() {
      var saved = localStorage.getItem('docs-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var initial = saved || (prefersDark ? 'dark' : 'light');
      document.body.setAttribute('data-theme', initial);
    })();

    window.$docsify = {
      name: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path><path d="m9 12 2 2 4-4"></path></svg> Cybersecurity Learning',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search docs',
        noData: 'No results found',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script>
    (function() {
      var button = document.getElementById('themeToggle');
      var label = document.getElementById('themeLabel');
      function applyRouteClass() {
        var h = (location.hash || '').toLowerCase();
        var isMobilePentest = h.indexOf('notes/mobile-pentest') !== -1;
        document.body.classList.toggle('route-mobile-pentest', isMobilePentest);
      }

      function paintToggle() {
        var isDark = document.body.getAttribute('data-theme') === 'dark';
        label.textContent = isDark ? 'Light' : 'Dark';
        button.innerHTML = '<i data-lucide="' + (isDark ? 'sun' : 'moon-star') + '"></i><span id="themeLabel">' + label.textContent + '</span>';
        label = document.getElementById('themeLabel');
        if (window.lucide) {
          lucide.createIcons();
        }
      }

      button.addEventListener('click', function() {
        var current = document.body.getAttribute('data-theme') || 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', next);
        localStorage.setItem('docs-theme', next);
        paintToggle();
      });

      paintToggle();
      applyRouteClass();
      window.addEventListener('hashchange', applyRouteClass);

      document.addEventListener('DOMContentLoaded', function() {
        if (window.lucide) {
          lucide.createIcons();
        }
        applyRouteClass();
      });
    })();
  </script>
</body>
</html>
