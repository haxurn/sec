<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cybersecurity Learning</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Cybersecurity learning documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b10;
      --s1: #0c1018;
      --s2: #111820;
      --s3: #161f2a;
      --border: #1c2838;
      --border2: #243040;
      --cyan: #00d4ff;
      --green: #39ff8a;
      --orange: #ff7c3a;
      --red: #ff3a5c;
      --yellow: #ffd234;
      --purple: #b06cff;
      --text: #b8cfe0;
      --text2: #7a9ab8;
      --text3: #3d5a72;
      --white: #e8f4ff;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
    }
    
    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,212,255,0.012) 2px, rgba(0,212,255,0.012) 4px);
      pointer-events: none;
      z-index: 9999;
    }
    
    /* Dot grid */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(0,212,255,0.08) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }
    
    .sidebar { background: var(--s1) !important; border-right: 1px solid var(--border) !important; }
    .sidebar-nav li { color: var(--text2) !important; }
    .sidebar-nav li.active, .sidebar-nav li:hover { color: var(--cyan) !important; }
    .sidebar-nav li.active { border-left: 2px solid var(--cyan); background: rgba(0,212,255,0.06); }
    .sidebar > h1 { font-family: 'Syne', sans-serif; color: var(--white) !important; }
    .sidebar > h1 .app-name-link { color: var(--cyan) !important; }
    
    .content { background: var(--bg); }
    .markdown-section { color: var(--text); }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 { 
      font-family: 'Syne', sans-serif; 
      color: var(--white) !important; 
      font-weight: 800;
    }
    .markdown-section h1 { font-size: 2.5em; }
    .markdown-section h2 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: 0.5em; }
    .markdown-section a { color: var(--cyan); }
    .markdown-section a:hover { color: var(--green); }
    .markdown-section code { 
      background: var(--s2); 
      color: var(--green); 
      padding: 2px 6px; 
      border-radius: 3px;
      border: 1px solid var(--border);
    }
    .markdown-section pre { 
      background: #060a0e !important; 
      border: 1px solid var(--border); 
      border-radius: 6px;
    }
    .markdown-section pre code { 
      background: transparent; 
      border: none; 
      color: #c8e0f0;
    }
    .markdown-section blockquote { 
      background: rgba(0,212,255,0.04); 
      border-left: 3px solid var(--cyan); 
      color: var(--text2);
    }
    .markdown-section table { border: 1px solid var(--border); }
    .markdown-section th { background: var(--s1); color: var(--text3); border: 1px solid var(--border); }
    .markdown-section td { border: 1px solid var(--border); }
    .markdown-section tr:hover { background: rgba(255,255,255,0.015); }
    
    .docsify-copy-code-button { 
      background: var(--s3) !important; 
      color: var(--text3) !important;
      border: 1px solid var(--border);
    }
    .docsify-copy-code-button:hover { color: var(--cyan) !important; }
    
    .search input { 
      background: var(--s2) !important; 
      border: 1px solid var(--border) !important; 
      color: var(--text) !important;
    }
    .search input:focus { border-color: var(--cyan) !important; }
    .matching-post { border-bottom: 1px solid var(--border); }
    .search .results-panel { background: var(--s1); border: 1px solid var(--border); }
    .search .results-panel a { color: var(--text); }
    .search .results-panel a:hover { color: var(--cyan); }
    
    .pagination-item-label { color: var(--text3); }
    .pagination-item-label:hover { color: var(--cyan); }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: '🔐 Cybersecurity Learning',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search...',
        noData: 'No results found',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
