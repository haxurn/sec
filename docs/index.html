<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cybersecurity Learning</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Cybersecurity learning documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #f3f1eb;
      --paper: #f8f6f1;
      --ink: #1b201d;
      --ink-soft: #4b584f;
      --muted: #6f7f75;
      --line: #d3d9d2;
      --brand: #0b6b50;
      --brand-2: #8f3f1f;
      --sidebar-bg: #111612;
      --sidebar-ink: #dce8de;
      --sidebar-muted: #90a392;
      --sidebar-line: #2a362d;
      --code-bg: #141b17;
      --code-line: #2d3f34;
      --code-ink: #d6ebdf;
      --radius: 10px;
      --shadow: 0 8px 24px rgba(26, 31, 27, 0.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(27, 32, 29, 0.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(27, 32, 29, 0.035) 1px, transparent 1px),
        linear-gradient(180deg, #f5f3ee 0%, var(--bg) 58%, #ece9e2 100%);
      background-size: 26px 26px, 26px 26px, auto;
      color: var(--ink) !important;
      font-family: 'Manrope', sans-serif !important;
      font-size: 16px;
      line-height: 1.7;
    }

    .sidebar {
      background: var(--sidebar-bg) !important;
      border-right: 1px solid var(--sidebar-line) !important;
    }

    .sidebar > h1 {
      margin: 0 !important;
      padding: 22px 18px 14px !important;
      border-bottom: 1px solid var(--sidebar-line);
      color: var(--sidebar-ink) !important;
      font-family: 'Manrope', sans-serif !important;
      font-size: 17px !important;
      font-weight: 800 !important;
      letter-spacing: 0.01em;
      line-height: 1.28 !important;
    }

    .sidebar > h1 a {
      color: inherit !important;
      text-decoration: none !important;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .search {
      margin: 0 !important;
      padding: 12px 14px !important;
      border-bottom: 1px solid var(--sidebar-line) !important;
    }

    .search input {
      width: 100% !important;
      border: 1px solid #36453a !important;
      border-radius: 8px !important;
      padding: 9px 10px !important;
      background: #1a231d !important;
      color: var(--sidebar-ink) !important;
      font-family: 'IBM Plex Mono', monospace !important;
      font-size: 12px !important;
    }

    .search input::placeholder {
      color: #8ea392 !important;
    }

    .search input:focus {
      outline: none !important;
      border-color: #5f8b72 !important;
    }

    .search .results-panel {
      margin-top: 8px !important;
      border: 1px solid #2f3f34 !important;
      border-radius: 8px !important;
      background: #151d18 !important;
      overflow: hidden;
    }

    .search .matching-post {
      border-bottom: 1px solid #27342c !important;
    }

    .search .matching-post:last-child {
      border-bottom: 0 !important;
    }

    .search .matching-post a {
      color: #b7cab9 !important;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 9px 10px !important;
    }

    .search .matching-post a:hover {
      color: #e1f1e4 !important;
      background: #213128 !important;
    }

    .sidebar-nav {
      padding: 10px 0 14px !important;
      font-family: 'IBM Plex Mono', monospace;
    }

    .sidebar-nav ul,
    .sidebar-nav li {
      list-style: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .sidebar-nav > ul > li > strong {
      display: block;
      padding: 8px 16px;
      color: var(--sidebar-muted) !important;
      font-size: 11px !important;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .sidebar-nav a {
      display: block;
      margin: 0 8px;
      padding: 9px 10px !important;
      border-left: 2px solid transparent;
      border-radius: 6px;
      color: #b2c6b5 !important;
      text-decoration: none !important;
      font-size: 12px !important;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .sidebar-nav a:hover {
      color: #e2f1e4 !important;
      background: #1c281f !important;
      border-left-color: #6ea287;
    }

    .sidebar-nav li.active > a {
      color: #f4fff5 !important;
      background: #203126 !important;
      border-left-color: #3fc48f;
      font-weight: 600 !important;
    }

    .content {
      background: transparent !important;
      padding-top: 0 !important;
    }

    .markdown-section {
      max-width: 1080px !important;
      margin: 0 auto !important;
      padding: clamp(24px, 5vw, 56px) clamp(18px, 5vw, 64px) 56px !important;
      color: var(--ink) !important;
      border-left: 1px solid rgba(27, 32, 29, 0.08);
      border-right: 1px solid rgba(27, 32, 29, 0.08);
      background: linear-gradient(180deg, rgba(248, 246, 241, 0.9), rgba(248, 246, 241, 0.74));
      box-shadow: var(--shadow);
      min-height: 100vh;
    }

    body.route-mobile-pentest .markdown-section {
      border: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      max-width: 1200px !important;
      padding-top: 22px !important;
    }

    .markdown-section > :first-child {
      margin-top: 0 !important;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      color: var(--ink) !important;
      font-family: 'Manrope', sans-serif !important;
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin-top: 1.8em !important;
      margin-bottom: 0.72em !important;
    }

    .markdown-section h1 {
      font-size: clamp(2rem, 5vw, 3.35rem) !important;
      font-weight: 800 !important;
      text-transform: none;
      position: relative;
      padding-bottom: 14px;
    }

    .markdown-section h1::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 96px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
    }

    .markdown-section h2 {
      font-size: clamp(1.4rem, 3.2vw, 2.15rem) !important;
      font-weight: 750 !important;
      border-bottom: 1px solid var(--line);
      padding-bottom: 9px;
    }

    .markdown-section h3 {
      font-size: clamp(1.16rem, 2.2vw, 1.45rem) !important;
      font-weight: 700 !important;
    }

    .markdown-section p,
    .markdown-section li {
      color: var(--ink-soft) !important;
      font-size: clamp(1rem, 1.15vw, 1.08rem);
    }

    .markdown-section ul,
    .markdown-section ol {
      padding-left: 1.35em !important;
      margin: 0.9em 0 1.2em !important;
    }

    .markdown-section li {
      margin: 0.35em 0 !important;
    }

    .markdown-section strong {
      color: var(--ink) !important;
      font-weight: 700;
    }

    .markdown-section a {
      color: var(--brand) !important;
      text-decoration: none !important;
      border-bottom: 1px dashed rgba(11, 107, 80, 0.35);
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .markdown-section a:hover {
      color: var(--brand-2) !important;
      border-bottom-color: rgba(143, 63, 31, 0.55);
    }

    .markdown-section blockquote {
      margin: 1.25em 0 !important;
      padding: 12px 14px !important;
      border-left: 4px solid var(--brand-2) !important;
      background: rgba(143, 63, 31, 0.06) !important;
      color: #5d4a41 !important;
      border-radius: 0 var(--radius) var(--radius) 0 !important;
    }

    .markdown-section code {
      border: 1px solid #cad7cb !important;
      border-radius: 6px !important;
      padding: 2px 7px !important;
      background: #eef4ee !important;
      color: #245846 !important;
      font-family: 'IBM Plex Mono', monospace !important;
      font-size: 0.9em !important;
    }

    .markdown-section pre {
      margin: 1.35em 0 !important;
      padding: 14px !important;
      border-radius: 10px !important;
      border: 1px solid var(--code-line) !important;
      background: var(--code-bg) !important;
      overflow-x: auto;
    }

    .markdown-section pre code {
      border: 0 !important;
      background: transparent !important;
      color: var(--code-ink) !important;
      padding: 0 !important;
      font-size: 13px !important;
      line-height: 1.72 !important;
    }

    .docsify-copy-code-button {
      margin: 8px !important;
      border: 1px solid rgba(210, 225, 216, 0.45) !important;
      border-radius: 999px !important;
      padding: 4px 10px !important;
      background: rgba(255, 255, 255, 0.14) !important;
      color: #d8e9dc !important;
      font-family: 'IBM Plex Mono', monospace !important;
      font-size: 11px !important;
    }

    .markdown-section hr {
      border: 0 !important;
      border-top: 1px solid var(--line) !important;
      margin: 2.05em 0 !important;
    }

    .markdown-section table {
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 1.15em 0 1.35em !important;
      border: 1px solid var(--line) !important;
      border-radius: 10px;
      overflow: hidden;
    }

    .markdown-section thead th {
      background: rgba(11, 107, 80, 0.11) !important;
      color: var(--ink) !important;
      border-bottom: 1px solid var(--line) !important;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px !important;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .markdown-section th,
    .markdown-section td {
      border-right: 1px solid var(--line) !important;
      padding: 10px 12px !important;
      color: var(--ink-soft) !important;
    }

    .markdown-section th:last-child,
    .markdown-section td:last-child {
      border-right: 0 !important;
    }

    .markdown-section tbody tr:nth-child(even) {
      background: rgba(11, 107, 80, 0.04) !important;
    }

    .pagination-item-label {
      color: var(--muted) !important;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px !important;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pagination-item-title {
      color: var(--ink) !important;
      font-family: 'Manrope', sans-serif;
      font-size: 15px !important;
      font-weight: 700;
    }

    .app-nav {
      margin-right: 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }

    .app-nav a {
      color: var(--ink-soft) !important;
    }

    .app-nav a:hover {
      color: var(--ink) !important;
    }

    @media (max-width: 900px) {
      .markdown-section {
        margin: 0 !important;
        border-left: 0;
        border-right: 0;
        box-shadow: none;
        background: rgba(248, 246, 241, 0.8);
        padding: 24px 18px 44px !important;
      }
    }

    @media (max-width: 640px) {
      body {
        font-size: 15px;
      }

      .sidebar > h1 {
        font-size: 16px !important;
        padding: 20px 15px 11px !important;
      }

      .sidebar-nav a {
        margin: 0 7px;
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading documentation...</div>

  <script>
    window.$docsify = {
      name: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path><path d="m9 12 2 2 4-4"></path></svg> Cybersecurity Learning',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search docs',
        noData: 'No results found',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script>
    (function() {
      function applyRouteClass() {
        var h = (location.hash || '').toLowerCase();
        var isMobilePentest = h.indexOf('notes/mobile-pentest') !== -1;
        document.body.classList.toggle('route-mobile-pentest', isMobilePentest);
      }

      applyRouteClass();
      window.addEventListener('hashchange', applyRouteClass);

      document.addEventListener('DOMContentLoaded', function() {
        if (window.lucide) {
          lucide.createIcons();
        }
        applyRouteClass();
      });
    })();
  </script>
</body>
</html>
