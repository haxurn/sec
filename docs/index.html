<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cybersecurity Learning</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Cybersecurity learning documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    :root {
      --bg: #080b10;
      --s1: #0c1018;
      --s2: #111820;
      --s3: #161f2a;
      --border: #1c2838;
      --border2: #243040;
      --cyan: #00d4ff;
      --green: #39ff8a;
      --orange: #ff7c3a;
      --red: #ff3a5c;
      --yellow: #ffd234;
      --purple: #b06cff;
      --text: #b8cfe0;
      --text2: #7a9ab8;
      --text3: #3d5a72;
      --white: #e8f4ff;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'JetBrains Mono', monospace !important;
      background: var(--bg) !important;
      color: var(--text) !important;
      font-size: 14px;
      line-height: 1.6;
    }
    
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,212,255,0.012) 2px, rgba(0,212,255,0.012) 4px);
      pointer-events: none;
      z-index: 9999;
    }
    
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(0,212,255,0.08) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }
    
    .sidebar {
      background: var(--s1) !important;
      border-right: 1px solid var(--border) !important;
      color: var(--text) !important;
    }
    
    .sidebar > h1 {
      font-family: 'Syne', sans-serif !important;
      color: var(--white) !important;
      font-weight: 800 !important;
      margin: 0 !important;
      padding: 24px 20px 16px !important;
      border-bottom: 1px solid var(--border);
      font-size: 17px !important;
    }
    
    .sidebar > h1 a {
      color: var(--white) !important;
      text-decoration: none !important;
    }
    
    .sidebar-nav {
      padding: 8px 0 !important;
    }
    
    .sidebar-nav ul {
      padding: 0 !important;
      margin: 0 !important;
    }
    
    .sidebar-nav li {
      list-style: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    
    .sidebar-nav > ul > li > strong {
      color: var(--text3) !important;
      font-size: 9px !important;
      letter-spacing: 2px !important;
      text-transform: uppercase !important;
      display: block !important;
      padding: 9px 20px !important;
      margin-bottom: 4px !important;
    }
    
    .sidebar-nav a {
      color: var(--text2) !important;
      text-decoration: none !important;
      display: block !important;
      padding: 8px 20px !important;
      font-size: 12px !important;
      border-left: 2px solid transparent !important;
      transition: all 0.15s !important;
    }
    
    .sidebar-nav a:hover {
      color: var(--white) !important;
      background: var(--s2) !important;
      border-left-color: var(--border2) !important;
    }
    
    .sidebar-nav li.active > a {
      color: var(--cyan) !important;
      background: rgba(0,212,255,0.06) !important;
      border-left-color: var(--cyan) !important;
      font-weight: 600 !important;
    }
    
    .sidebar-nav ul ul a {
      padding-left: 40px !important;
      font-size: 11px !important;
    }
    
    .content {
      background: var(--bg) !important;
      padding-top: 0 !important;
    }
    
    .markdown-section {
      color: var(--text) !important;
      max-width: 900px !important;
      padding: 40px 48px !important;
    }
    
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      font-family: 'Syne', sans-serif !important;
      color: var(--white) !important;
      font-weight: 800 !important;
      margin-top: 2em !important;
      margin-bottom: 1em !important;
    }
    
    .markdown-section h1 {
      font-size: clamp(32px, 4vw, 52px) !important;
      line-height: 1.1 !important;
      margin-top: 0 !important;
      margin-bottom: 0.5em !important;
    }
    
    .markdown-section h2 {
      font-size: 1.8em !important;
      border-bottom: 1px solid var(--border) !important;
      padding-bottom: 0.5em !important;
    }
    
    .markdown-section h3 {
      font-size: 1.4em !important;
      color: var(--cyan) !important;
    }
    
    .markdown-section p {
      line-height: 1.7 !important;
      margin: 1em 0 !important;
    }
    
    .markdown-section a {
      color: var(--cyan) !important;
      text-decoration: none !important;
      border-bottom: 1px solid transparent !important;
      transition: all 0.2s !important;
    }
    
    .markdown-section a:hover {
      color: var(--green) !important;
      border-bottom-color: var(--green) !important;
    }
    
    .markdown-section code {
      background: var(--s2) !important;
      color: var(--green) !important;
      padding: 2px 8px !important;
      border-radius: 3px !important;
      border: 1px solid var(--border) !important;
      font-size: 0.9em !important;
    }
    
    .markdown-section pre {
      background: #060a0e !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
      padding: 16px !important;
      margin: 1.5em 0 !important;
      overflow-x: auto !important;
    }
    
    .markdown-section pre code {
      background: transparent !important;
      border: none !important;
      color: #c8e0f0 !important;
      padding: 0 !important;
      font-size: 0.85em !important;
      line-height: 1.7 !important;
    }
    
    .markdown-section blockquote {
      background: rgba(0,212,255,0.04) !important;
      border-left: 3px solid var(--cyan) !important;
      color: var(--text2) !important;
      padding: 12px 20px !important;
      margin: 1.5em 0 !important;
      border-radius: 0 4px 4px 0 !important;
    }
    
    .markdown-section table {
      border: 1px solid var(--border) !important;
      border-collapse: collapse !important;
      width: 100% !important;
      margin: 1.5em 0 !important;
      font-size: 0.9em !important;
    }
    
    .markdown-section th {
      background: var(--s1) !important;
      color: var(--text3) !important;
      border: 1px solid var(--border) !important;
      padding: 10px 14px !important;
      text-align: left !important;
      font-weight: 600 !important;
      letter-spacing: 1px !important;
      text-transform: uppercase !important;
      font-size: 0.85em !important;
    }
    
    .markdown-section td {
      border: 1px solid var(--border) !important;
      padding: 10px 14px !important;
    }
    
    .markdown-section tr:hover {
      background: rgba(255,255,255,0.015) !important;
    }
    
    .markdown-section ul,
    .markdown-section ol {
      padding-left: 1.5em !important;
      margin: 1em 0 !important;
    }
    
    .markdown-section li {
      margin: 0.5em 0 !important;
      line-height: 1.7 !important;
    }
    
    .markdown-section hr {
      border: none !important;
      border-top: 1px solid var(--border) !important;
      margin: 3em 0 !important;
    }
    
    .docsify-copy-code-button {
      background: var(--s3) !important;
      color: var(--text3) !important;
      border: 1px solid var(--border) !important;
      border-radius: 3px !important;
      font-size: 11px !important;
      padding: 4px 10px !important;
    }
    
    .docsify-copy-code-button:hover {
      color: var(--cyan) !important;
      background: rgba(0,212,255,0.08) !important;
    }
    
    .search {
      border-bottom: 1px solid var(--border) !important;
      padding: 16px 20px !important;
      margin-bottom: 0 !important;
    }
    
    .search input {
      background: var(--s2) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      padding: 8px 12px !important;
      border-radius: 4px !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 12px !important;
      width: 100% !important;
    }
    
    .search input:focus {
      border-color: var(--cyan) !important;
      outline: none !important;
    }
    
    .search input::placeholder {
      color: var(--text3) !important;
    }
    
    .search .results-panel {
      background: var(--s1) !important;
      border: 1px solid var(--border) !important;
      border-radius: 4px !important;
      margin-top: 8px !important;
    }
    
    .search .matching-post {
      border-bottom: 1px solid var(--border) !important;
    }
    
    .search .matching-post a {
      color: var(--text) !important;
      padding: 10px 12px !important;
      display: block !important;
    }
    
    .search .matching-post a:hover {
      color: var(--cyan) !important;
      background: rgba(0,212,255,0.06) !important;
    }
    
    .pagination-item-label {
      color: var(--text3) !important;
      font-size: 11px !important;
      letter-spacing: 1px !important;
    }
    
    .pagination-item-label:hover {
      color: var(--cyan) !important;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text3);
    }
    
    @media (max-width: 768px) {
      .markdown-section {
        padding: 24px 20px !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: '🔐 Cybersecurity Learning',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search...',
        noData: 'No results found',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
