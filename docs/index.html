<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <title>Cybersecurity Learning</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Cybersecurity learning documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    (function() {
      var stored = localStorage.getItem('docs-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = stored ? stored === 'dark' : prefersDark;
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>

  <script>
    tailwind = window.tailwind || {};
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace']
          },
          colors: {
            brand: {
              500: '#0d9488',
              600: '#0f766e'
            },
            ember: {
              500: '#f97316',
              600: '#ea580c'
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --bg-1: #f6f8fb;
      --bg-2: #edf2f8;
      --bg-3: #e8eef6;
      --ink: #172334;
      --ink-soft: #445d78;
      --muted: #6f87a2;
      --line: #d6e1ef;
      --line-strong: #b8cbe2;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-2: rgba(255, 255, 255, 0.78);
      --surface-3: rgba(248, 251, 255, 0.95);
      --sidebar-bg: rgba(255, 255, 255, 0.92);
      --sidebar-ink: #1d3550;
      --sidebar-muted: #607a98;
      --sidebar-line: #d2e0ef;
      --brand: #0f766e;
      --brand-2: #ea580c;
      --code-bg: linear-gradient(180deg, #162232, #101a2a);
      --code-line: #27435f;
      --code-ink: #d8e7fa;
      --shadow-sm: 0 8px 22px rgba(30, 50, 85, 0.08);
      --shadow-md: 0 20px 52px rgba(30, 50, 85, 0.13);
      --focus: 0 0 0 3px rgba(15, 118, 110, 0.25);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    html.dark {
      --bg-1: #0e1522;
      --bg-2: #111b2a;
      --bg-3: #0c1624;
      --ink: #e6f1ff;
      --ink-soft: #9db2cc;
      --muted: #7f98b8;
      --line: #2a3f5a;
      --line-strong: #3d6187;
      --surface: rgba(16, 26, 40, 0.9);
      --surface-2: rgba(18, 30, 47, 0.84);
      --surface-3: rgba(20, 33, 52, 0.9);
      --sidebar-bg: rgba(14, 24, 38, 0.93);
      --sidebar-ink: #dcecff;
      --sidebar-muted: #9cb4d0;
      --sidebar-line: #2c4562;
      --brand: #2dd4bf;
      --brand-2: #fb923c;
      --code-bg: linear-gradient(180deg, #111c2e, #0d1728);
      --code-line: #32557b;
      --code-ink: #d9ebff;
      --shadow-sm: 0 10px 26px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 24px 60px rgba(0, 0, 0, 0.45);
      --focus: 0 0 0 3px rgba(45, 212, 191, 0.28);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink) !important;
      font-family: 'Manrope', sans-serif !important;
      font-size: 16px;
      line-height: 1.7;
      background:
        radial-gradient(1200px 700px at 5% -10%, rgba(14, 165, 163, 0.18), transparent 45%),
        radial-gradient(1000px 600px at 96% 6%, rgba(249, 115, 22, 0.16), transparent 50%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      transition: background 0.25s ease, color 0.2s ease;
    }

    ::selection {
      background: rgba(15, 118, 110, 0.25);
      color: var(--ink);
    }

    .sidebar {
      background: var(--sidebar-bg) !important;
      border-right: 1px solid var(--sidebar-line) !important;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-sm);
    }

    .sidebar > h1 {
      margin: 0 !important;
      padding: 22px 18px 14px !important;
      border-bottom: 1px solid var(--sidebar-line);
      color: var(--sidebar-ink) !important;
      font-family: 'Manrope', sans-serif !important;
      font-size: 18px !important;
      font-weight: 800 !important;
      letter-spacing: -0.01em;
      line-height: 1.28 !important;
    }

    .sidebar > h1 a {
      color: inherit !important;
      text-decoration: none !important;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .search {
      margin: 0 !important;
      padding: 12px 14px !important;
      border-bottom: 1px solid var(--sidebar-line) !important;
    }

    .search input {
      width: 100% !important;
      border: 1px solid var(--sidebar-line) !important;
      border-radius: 9px !important;
      padding: 9px 11px !important;
      background: var(--surface-3) !important;
      color: var(--sidebar-ink) !important;
      font-family: 'IBM Plex Mono', monospace !important;
      font-size: 12px !important;
    }

    .search input::placeholder {
      color: var(--sidebar-muted) !important;
    }

    .search input:focus {
      outline: none !important;
      border-color: var(--brand) !important;
      box-shadow: var(--focus) !important;
    }

    .search .results-panel {
      margin-top: 8px !important;
      border: 1px solid var(--sidebar-line) !important;
      border-radius: 10px !important;
      background: var(--surface) !important;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .search .matching-post {
      border-bottom: 1px solid var(--sidebar-line) !important;
    }

    .search .matching-post:last-child {
      border-bottom: 0 !important;
    }

    .search .matching-post a {
      color: var(--sidebar-ink) !important;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 10px 11px !important;
    }

    .search .matching-post a:hover {
      color: var(--ink) !important;
      background: rgba(15, 118, 110, 0.12) !important;
    }

    .sidebar-nav {
      padding: 10px 0 14px !important;
      font-family: 'IBM Plex Mono', monospace;
    }

    .sidebar-nav ul,
    .sidebar-nav li {
      list-style: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .sidebar-nav > ul > li > strong {
      display: block;
      padding: 8px 16px;
      color: var(--sidebar-muted) !important;
      font-size: 11px !important;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .sidebar-nav a {
      display: block;
      margin: 0 8px;
      padding: 9px 10px !important;
      border-left: 2px solid transparent;
      border-radius: 7px;
      color: var(--sidebar-ink) !important;
      text-decoration: none !important;
      font-size: 12px !important;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .sidebar-nav a:hover {
      background: rgba(15, 118, 110, 0.12) !important;
      border-left-color: var(--brand);
      transform: translateX(2px);
    }

    .sidebar-nav li.active > a {
      background: linear-gradient(120deg, rgba(15, 118, 110, 0.2), rgba(234, 88, 12, 0.14)) !important;
      border-left-color: var(--brand);
      color: var(--ink) !important;
      font-weight: 600 !important;
    }

    .content {
      background: transparent !important;
      padding-top: 0 !important;
    }

    .markdown-section {
      max-width: 1080px !important;
      margin: 0 auto !important;
      min-height: 100vh;
      padding: clamp(24px, 5vw, 58px) clamp(18px, 5vw, 62px) 56px !important;
      color: var(--ink) !important;
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      box-shadow: var(--shadow-md);
    }

    body.route-mobile-pentest .markdown-section {
      border: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      max-width: 1220px !important;
      padding-top: 22px !important;
    }

    .markdown-section > :first-child {
      margin-top: 0 !important;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      color: var(--ink) !important;
      font-family: 'Manrope', sans-serif !important;
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin-top: 1.85em !important;
      margin-bottom: 0.75em !important;
    }

    .markdown-section h1 {
      font-size: clamp(2rem, 5vw, 3.2rem) !important;
      font-weight: 800 !important;
      position: relative;
      padding-bottom: 14px;
    }

    .markdown-section h1::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 96px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
    }

    .markdown-section h2 {
      font-size: clamp(1.38rem, 3.2vw, 2.06rem) !important;
      border-bottom: 1px solid var(--line);
      padding-bottom: 9px;
      font-weight: 760 !important;
    }

    .markdown-section h3 {
      font-size: clamp(1.14rem, 2.2vw, 1.45rem) !important;
      font-weight: 700 !important;
    }

    .markdown-section p,
    .markdown-section li {
      color: var(--ink-soft) !important;
      font-size: clamp(1rem, 1.15vw, 1.08rem);
    }

    .markdown-section ul,
    .markdown-section ol {
      padding-left: 1.35em !important;
      margin: 0.9em 0 1.2em !important;
    }

    .markdown-section li {
      margin: 0.36em 0 !important;
    }

    .markdown-section strong {
      color: var(--ink) !important;
    }

    .markdown-section a {
      color: var(--brand) !important;
      text-decoration: none !important;
      border-bottom: 1px dashed rgba(15, 118, 110, 0.35);
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .markdown-section a:hover {
      color: var(--brand-2) !important;
      border-bottom-color: rgba(234, 88, 12, 0.45);
    }

    .markdown-section blockquote {
      margin: 1.25em 0 !important;
      padding: 12px 14px !important;
      border-left: 4px solid var(--brand-2) !important;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0 !important;
      background: rgba(234, 88, 12, 0.08) !important;
      color: var(--ink-soft) !important;
    }

    .markdown-section code {
      border: 1px solid var(--line-strong) !important;
      border-radius: 6px !important;
      padding: 2px 7px !important;
      background: rgba(15, 118, 110, 0.12) !important;
      color: var(--brand) !important;
      font-family: 'IBM Plex Mono', monospace !important;
      font-size: 0.9em !important;
    }

    .markdown-section pre {
      margin: 1.35em 0 !important;
      padding: 14px !important;
      border-radius: var(--radius-md) !important;
      border: 1px solid var(--code-line) !important;
      background: var(--code-bg) !important;
      overflow-x: auto;
    }

    .markdown-section pre code {
      border: 0 !important;
      background: transparent !important;
      color: var(--code-ink) !important;
      padding: 0 !important;
      font-size: 13px !important;
      line-height: 1.7 !important;
    }

    .docsify-copy-code-button {
      margin: 8px !important;
      border: 1px solid rgba(219, 232, 248, 0.45) !important;
      border-radius: 999px !important;
      padding: 4px 10px !important;
      background: rgba(255, 255, 255, 0.12) !important;
      color: #d5e8ff !important;
      font-family: 'IBM Plex Mono', monospace !important;
      font-size: 11px !important;
    }

    .markdown-section hr {
      border: 0 !important;
      border-top: 1px solid var(--line) !important;
      margin: 2.1em 0 !important;
    }

    .markdown-section table {
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 1.2em 0 1.35em !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .markdown-section thead th {
      background: rgba(15, 118, 110, 0.14) !important;
      color: var(--ink) !important;
      border-bottom: 1px solid var(--line) !important;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px !important;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .markdown-section th,
    .markdown-section td {
      border-right: 1px solid var(--line) !important;
      padding: 10px 12px !important;
      color: var(--ink-soft) !important;
    }

    .markdown-section th:last-child,
    .markdown-section td:last-child {
      border-right: 0 !important;
    }

    .markdown-section tbody tr:nth-child(even) {
      background: rgba(15, 118, 110, 0.05) !important;
    }

    .pagination-item-label {
      color: var(--muted) !important;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px !important;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pagination-item-title {
      color: var(--ink) !important;
      font-family: 'Manrope', sans-serif;
      font-size: 15px !important;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .markdown-section {
        border-left: 0 !important;
        border-right: 0 !important;
        box-shadow: none !important;
        background: var(--surface-2) !important;
        padding: 24px 18px 44px !important;
      }
    }
  </style>
</head>
<body class="min-h-screen font-sans text-slate-900 dark:text-slate-100 antialiased">
  <div id="app-shell" class="fixed top-3 right-3 z-[9999] flex items-center gap-2">
    <a href="#/" class="inline-flex items-center gap-2 rounded-full border border-slate-300/70 bg-white/85 px-3 py-1.5 text-[11px] font-medium text-slate-700 shadow-sm backdrop-blur dark:border-slate-600/70 dark:bg-slate-900/80 dark:text-slate-200">
      <i data-lucide="shield-check" class="h-3.5 w-3.5"></i>
      Docs Home
    </a>
    <button id="themeToggle" class="inline-flex items-center gap-2 rounded-full border border-slate-300/70 bg-white/85 px-3 py-1.5 text-[11px] font-medium text-slate-700 shadow-sm backdrop-blur transition hover:translate-y-[-1px] dark:border-slate-600/70 dark:bg-slate-900/80 dark:text-slate-100" aria-label="Toggle theme">
      <i data-lucide="moon-star" class="h-3.5 w-3.5"></i>
      <span id="themeLabel">Dark</span>
    </button>
  </div>

  <div id="app">Loading documentation...</div>

  <script>
    window.$docsify = {
      name: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path><path d="m9 12 2 2 4-4"></path></svg> Cybersecurity Learning',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search docs',
        noData: 'No results found',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script>
    (function() {
      var root = document.documentElement;
      var button = document.getElementById('themeToggle');
      var label = document.getElementById('themeLabel');
      function getDocsBase() {
        var path = (location.pathname || '/').replace(/\/+$/, '');
        var match = path.match(/^(.*\/sec)(\/|$)/);
        return match ? match[1] : '';
      }

      function rewritePlannerLinks() {
        var base = getDocsBase();
        var mainHref = (base || '') + '/notes/mobile-pentest-plan.html';
        var fallbackHref = (base || '') + '/mobile-pentest-plan.html';
        document.querySelectorAll('a[data-planner-link=\"main\"]').forEach(function(a) {
          a.setAttribute('href', mainHref);
        });
        document.querySelectorAll('a[data-planner-link=\"fallback\"]').forEach(function(a) {
          a.setAttribute('href', fallbackHref);
        });
      }

      function schedulePlannerRewrite() {
        setTimeout(rewritePlannerLinks, 0);
        setTimeout(rewritePlannerLinks, 200);
      }

      function applyRouteClass() {
        var h = (location.hash || '').toLowerCase();
        var isMobilePentest = h.indexOf('notes/mobile-pentest') !== -1;
        document.body.classList.toggle('route-mobile-pentest', isMobilePentest);
      }

      function paintToggle() {
        var dark = root.classList.contains('dark');
        label.textContent = dark ? 'Light' : 'Dark';
        button.innerHTML = '<i data-lucide="' + (dark ? 'sun' : 'moon-star') + '" class="h-3.5 w-3.5"></i><span id="themeLabel">' + label.textContent + '</span>';
        label = document.getElementById('themeLabel');
        if (window.lucide) {
          lucide.createIcons();
        }
      }

      button.addEventListener('click', function() {
        root.classList.toggle('dark');
        localStorage.setItem('docs-theme', root.classList.contains('dark') ? 'dark' : 'light');
        paintToggle();
      });

      paintToggle();
      applyRouteClass();
      schedulePlannerRewrite();
      window.addEventListener('hashchange', applyRouteClass);
      window.addEventListener('hashchange', schedulePlannerRewrite);

      document.addEventListener('DOMContentLoaded', function() {
        if (window.lucide) {
          lucide.createIcons();
        }
        applyRouteClass();
        schedulePlannerRewrite();
      });
    })();
  </script>
</body>
</html>
